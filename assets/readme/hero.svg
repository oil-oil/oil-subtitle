<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">oil-subtitle 本地视频中文字幕工作流</title>
  <desc id="desc">从音频波形和转录文本，到人工校对、章节进度条以及 SRT、ASS、MP4 成片的完整流程。</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C74FF"/>
      <stop offset="1" stop-color="#6336E7"/>
    </linearGradient>
    <clipPath id="panel-clip">
      <rect x="626" y="42" width="526" height="294" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="30" fill="#12111B"/>
  <path d="M0 332H1200" stroke="#2A2838"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="63" fill="#A7A3BD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">CREATOR VIDEO TOOL / SDK ONLY</text>
    <text x="52" y="138" fill="#F8F7FC" font-size="58" font-weight="760" letter-spacing="-2">oil-subtitle</text>
    <text x="56" y="188" fill="#D7D4E3" font-size="27" font-weight="560">让本地视频拥有准确、可校对的</text>
    <text x="56" y="226" fill="#D7D4E3" font-size="27" font-weight="560">中文字幕和清晰的章节进度</text>

    <g transform="translate(56 281)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="650">
      <circle cx="5" cy="-5" r="5" fill="#7C74FF"/>
      <text x="20" y="1" fill="#E7E4F2">ONE API KEY</text>
      <path d="M142 -19V6" stroke="#4A465C"/>
      <text x="160" y="1" fill="#E7E4F2">LOCAL REVIEW</text>
      <path d="M296 -19V6" stroke="#4A465C"/>
      <text x="314" y="1" fill="#E7E4F2">SRT / ASS / MP4</text>
    </g>
  </g>

  <g id="subtitle-editor" clip-path="url(#panel-clip)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="626" y="42" width="526" height="294" rx="20" fill="#F7F6FC"/>
    <rect x="626" y="42" width="526" height="48" fill="#FFFFFF"/>
    <circle cx="650" cy="66" r="6" fill="#FF6B6B"/>
    <circle cx="670" cy="66" r="6" fill="#F7C948"/>
    <circle cx="690" cy="66" r="6" fill="#52D273"/>
    <text x="716" y="72" fill="#363247" font-size="18" font-weight="700">字幕预览</text>

    <rect x="626" y="90" width="354" height="246" fill="#09090F"/>
    <rect x="980" y="90" width="172" height="246" fill="#FFFFFF"/>
    <path d="M980 90V336" stroke="#E9E6F3"/>

    <g id="waveform" transform="translate(658 122)" fill="#7C74FF">
      <rect x="0" y="23" width="7" height="18" rx="3.5" opacity=".55"/>
      <rect x="17" y="14" width="7" height="36" rx="3.5" opacity=".70"/>
      <rect x="34" y="4" width="7" height="56" rx="3.5"/>
      <rect x="51" y="18" width="7" height="28" rx="3.5" opacity=".72"/>
      <rect x="68" y="9" width="7" height="46" rx="3.5" opacity=".88"/>
      <rect x="85" y="0" width="7" height="64" rx="3.5"/>
      <rect x="102" y="16" width="7" height="32" rx="3.5" opacity=".78"/>
      <rect x="119" y="6" width="7" height="52" rx="3.5"/>
      <rect x="136" y="20" width="7" height="24" rx="3.5" opacity=".65"/>
      <rect x="153" y="11" width="7" height="42" rx="3.5" opacity=".85"/>
      <rect x="170" y="22" width="7" height="20" rx="3.5" opacity=".55"/>
      <rect x="187" y="15" width="7" height="34" rx="3.5" opacity=".72"/>
      <rect x="204" y="7" width="7" height="50" rx="3.5"/>
      <rect x="221" y="18" width="7" height="28" rx="3.5" opacity=".65"/>
      <rect x="238" y="12" width="7" height="40" rx="3.5" opacity=".86"/>
      <rect x="255" y="23" width="7" height="18" rx="3.5" opacity=".55"/>
    </g>

    <rect x="673" y="213" width="260" height="52" rx="8" fill="#1C1B24" fill-opacity=".92"/>
    <text x="803" y="246" fill="#FFFFFF" font-size="21" font-weight="650" text-anchor="middle">字幕先校对，再一次烧录</text>

    <g id="chapter-progress">
      <rect x="626" y="304" width="354" height="32" fill="#282733"/>
      <rect x="626" y="304" width="218" height="4" fill="url(#accent)"/>
      <path d="M744 304V336M862 304V336" stroke="#FFFFFF" stroke-opacity=".18"/>
      <text x="684" y="328" fill="#EAE8F2" font-size="18" text-anchor="middle">转录</text>
      <text x="803" y="328" fill="#EAE8F2" font-size="18" text-anchor="middle">校对</text>
      <text x="921" y="328" fill="#AAA6BA" font-size="18" text-anchor="middle">成片</text>
    </g>

    <g id="subtitle-list">
      <text x="1000" y="122" fill="#8B89A6" font-size="18" font-weight="650">中文字幕</text>
      <rect x="994" y="139" width="144" height="48" rx="10" fill="#F7F6FC"/>
      <rect x="1007" y="151" width="104" height="7" rx="3.5" fill="#C9C5D6"/>
      <rect x="1007" y="166" width="72" height="6" rx="3" fill="#E0DDEA"/>

      <rect x="994" y="195" width="144" height="58" rx="10" fill="#EFEBFD"/>
      <rect x="1007" y="209" width="116" height="8" rx="4" fill="#6336E7"/>
      <rect x="1007" y="226" width="82" height="7" rx="3.5" fill="#A89BEF"/>
      <circle cx="1120" cy="237" r="4" fill="#6336E7"/>

      <rect x="994" y="261" width="144" height="48" rx="10" fill="#F7F6FC"/>
      <rect x="1007" y="273" width="95" height="7" rx="3.5" fill="#C9C5D6"/>
      <rect x="1007" y="288" width="110" height="6" rx="3" fill="#E0DDEA"/>
    </g>
  </g>

  <g id="output" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M882 351H922" stroke="#6F69F7" stroke-width="2" stroke-dasharray="4 6"/>
    <circle cx="882" cy="351" r="5" fill="#7C74FF"/>
    <rect x="922" y="334" width="230" height="34" rx="17" fill="#F8F7FC"/>
    <text x="1037" y="357" fill="#2E2940" font-size="18" font-weight="700" text-anchor="middle">demo_subtitled.mp4</text>
  </g>
</svg>
